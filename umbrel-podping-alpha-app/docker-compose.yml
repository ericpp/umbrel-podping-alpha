version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: umbrel-podping-alpha-app_web_1
      APP_PORT: 8089

  web:
    image: ericpp/podping-gossipwatcher@sha256:99afd8658df31c5b753966611fe95ace454a4a5d6d447bf789bb9525b8be006a
    init: true
    working_dir: /data
    restart: on-failure
    stop_grace_period: 1m
    user: "1000:1000"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    volumes:
      - ${APP_DATA_DIR}/data:/data
    environment:
      NODE_FRIENDLY_NAME: "${APP_NODE_FRIENDLY_NAME}"
      SSE_ENABLED: "1"
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M
