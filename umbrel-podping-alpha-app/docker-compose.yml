version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: umbrel-podping-alpha-app_web_1
      APP_PORT: 8089

  web:
    image: ericpp/podping-gossipwatcher:latest@sha256:a388a8ac08f4b860e2fca8c0de2b2ca03506e48bcce12b8d52bbd46827f0f19a
    init: true
    working_dir: /data
    restart: on-failure
    stop_grace_period: 1m
    user: "1000:1000"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    volumes:
      - ${APP_DATA_DIR}/data:/data
    environment:
      NODE_FRIENDLY_NAME: "${APP_NODE_FRIENDLY_NAME}"
      SSE_ENABLED: "1"
